name: Build PhotoPicker for Godot 4.6.3

on:
  workflow_dispatch:

jobs:
  build-photopicker:

    name: PhotoPicker - Godot 4.6.3

    runs-on: macos-15-intel

    steps:

      # ==========================================================
      # 0. CHECKOUT DO REPOSITÓRIO FLUXUS PHOTOPICKER
      # ==========================================================

      - name: Checkout Fluxus PhotoPicker repository
        uses: actions/checkout@v4


      # ==========================================================
      # 1. VERIFICAR AMBIENTE
      # ==========================================================

      - name: Show environment
        run: |
          echo "===== macOS ====="
          sw_vers

          echo ""
          echo "===== Architecture ====="
          uname -m

          echo ""
          echo "===== Xcode ====="
          xcodebuild -version

          echo ""
          echo "===== Xcode Path ====="
          xcode-select -p

          echo ""
          echo "===== Clang ====="
          clang --version

          echo ""
          echo "===== Git ====="
          git --version

          echo ""
          echo "===== Python ====="
          python3 --version


      # ==========================================================
      # 2. INSTALAR SCONS
      # ==========================================================

      - name: Install SCons
        run: |
          brew install scons
          scons --version


      # ==========================================================
      # 3. VERIFICAR ARQUIVOS DO FLUXUS PHOTOPICKER
      # ==========================================================

      - name: Verify Fluxus PhotoPicker files
        shell: bash
        run: |

          echo "===== Fluxus PhotoPicker files ====="

          find plugins/photo_picker \
            -maxdepth 1 \
            -type f \
            -print

          echo ""

          for file in \
            plugins/photo_picker/photo_picker.h \
            plugins/photo_picker/photo_picker.mm \
            plugins/photo_picker/photo_picker.gdip
          do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing file: $file"
              exit 1
            fi
          done

          echo "All Fluxus PhotoPicker files found."


      # ==========================================================
      # 4. CLONAR GODOT IOS PLUGINS
      # ==========================================================

      - name: Clone godot-ios-plugins
        run: |
          git clone --recursive \
            https://github.com/godot-sdk-integrations/godot-ios-plugins.git

          cd godot-ios-plugins

          echo ""
          echo "===== Initial repository commit ====="
          git rev-parse HEAD


      # ==========================================================
      # 5. USAR A CORREÇÃO DO PHOTOPICKER PARA GODOT 4.6
      # ==========================================================

      - name: Checkout PhotoPicker Godot 4.6 fix
        run: |
          cd godot-ios-plugins

          git fetch origin pull/105/head:photo-picker-fix

          git checkout 2d94399

          echo ""
          echo "===== PhotoPicker commit ====="
          git rev-parse HEAD


      # ==========================================================
      # 6. INICIALIZAR / ATUALIZAR SUBMODULES
      # ==========================================================

      - name: Update submodules
        run: |
          cd godot-ios-plugins

          git submodule update --init --recursive


      # ==========================================================
      # 7. SELECIONAR GODOT 4.6.3
      # ==========================================================

      - name: Checkout Godot 4.6.3
        run: |
          cd godot-ios-plugins/godot

          git fetch --tags

          git checkout 4.6.3-stable

          echo ""
          echo "===== Godot version ====="
          git describe --tags --always

          echo ""
          echo "===== Godot commit ====="
          git rev-parse HEAD


      # ==========================================================
      # 8. APLICAR NOSSA VERSÃO PERSONALIZADA DO PHOTOPICKER
      # ==========================================================

      - name: Install custom Fluxus PhotoPicker source
        shell: bash
        run: |

          echo "===== Fluxus PhotoPicker source ====="

          find plugins/photo_picker \
            -maxdepth 1 \
            -type f \
            -print

          echo ""
          echo "===== Official PhotoPicker source before replacement ====="

          find godot-ios-plugins/plugins/photo_picker \
            -maxdepth 1 \
            -type f \
            -print

          echo ""
          echo "===== Removing official PhotoPicker source files ====="

          rm -f \
            godot-ios-plugins/plugins/photo_picker/photo_picker.mm \
            godot-ios-plugins/plugins/photo_picker/photo_picker.cpp \
            godot-ios-plugins/plugins/photo_picker/photo_picker.h \
            godot-ios-plugins/plugins/photo_picker/photo_picker.gdip

          echo ""
          echo "===== Copying Fluxus PhotoPicker files ====="

          cp \
            plugins/photo_picker/photo_picker.h \
            godot-ios-plugins/plugins/photo_picker/photo_picker.h

          cp \
            plugins/photo_picker/photo_picker.mm \
            godot-ios-plugins/plugins/photo_picker/photo_picker.mm

          cp \
            plugins/photo_picker/photo_picker.gdip \
            godot-ios-plugins/plugins/photo_picker/photo_picker.gdip

          echo ""
          echo "===== Installed PhotoPicker source ====="

          find godot-ios-plugins/plugins/photo_picker \
            -maxdepth 1 \
            -type f \
            -print


      # ==========================================================
      # 8.1 INSPECIONAR PHOTOPICKER
      # ==========================================================

      - name: Inspect PhotoPicker directory
        shell: bash
        run: |

          echo "======================================"
          echo "PHOTO PICKER DIRECTORY"
          echo "======================================"

          find godot-ios-plugins/plugins/photo_picker \
            -maxdepth 1 \
            -type f \
            -print

          echo ""
          echo "======================================"
          echo "ALL SOURCE FILES"
          echo "======================================"

          find godot-ios-plugins/plugins/photo_picker \
            -maxdepth 1 \
            -type f \
            \( -name "*.cpp" -o -name "*.mm" -o -name "*.m" \) \
            -print

          echo ""
          echo "======================================"
          echo "SEARCH INIT/DEINIT"
          echo "======================================"

          grep -R \
            -n \
            -E \
            'godot_photopicker_init|godot_photopicker_deinit' \
            godot-ios-plugins/plugins/photo_picker \
            || true


      # ==========================================================
      # 8.2 LOCALIZAR INICIALIZAÇÃO DO PHOTOPICKER
      # ==========================================================

      - name: Find PhotoPicker initialization
        shell: bash
        run: |

          echo "======================================"
          echo "SEARCH ENTIRE REPOSITORY"
          echo "======================================"

          grep -R \
            -n \
            -E \
            'godot_photopicker_init|godot_photopicker_deinit' \
            godot-ios-plugins \
            --exclude-dir=.git \
            || true


      # ==========================================================
      # 9. VERIFICAR NOSSA VERSÃO DO PHOTOPICKER
      # ==========================================================

      - name: Verify custom PhotoPicker source
        shell: bash
        run: |

          cd godot-ios-plugins

          echo "======================================"
          echo "PHOTO PICKER GDIP"
          echo "======================================"

          cat plugins/photo_picker/photo_picker.gdip


          echo ""
          echo "======================================"
          echo "VERIFY IOS FRAMEWORKS"
          echo "======================================"

          grep -q 'Photos.framework' \
            plugins/photo_picker/photo_picker.gdip \
            || {
              echo "ERROR: Photos.framework not declared."
              exit 1
            }

          grep -q 'PhotosUI.framework' \
            plugins/photo_picker/photo_picker.gdip \
            || {
              echo "ERROR: PhotosUI.framework not declared."
              exit 1
            }

          echo "OK: Photos.framework"
          echo "OK: PhotosUI.framework"


          echo ""
          echo "======================================"
          echo "VERIFY PHOTO LIBRARY PERMISSION"
          echo "======================================"

          grep -q 'NSPhotoLibraryAddUsageDescription' \
            plugins/photo_picker/photo_picker.gdip \
            || {
              echo "ERROR: NSPhotoLibraryAddUsageDescription not declared."
              exit 1
            }

          echo "OK: NSPhotoLibraryAddUsageDescription"


          echo ""
          echo "======================================"
          echo "VERIFY PHPICKER SOURCE"
          echo "======================================"

          grep -q 'PhotosUI/PhotosUI.h' \
            plugins/photo_picker/photo_picker.mm \
            || {
              echo "ERROR: PhotosUI header not found."
              exit 1
            }

          grep -q 'PHPickerViewController' \
            plugins/photo_picker/photo_picker.mm \
            || {
              echo "ERROR: PHPickerViewController not found."
              exit 1
            }

          echo "OK: PHPicker source detected."


          echo ""
          echo "======================================"
          echo "VERIFY PHOTOS SAVE SOURCE"
          echo "======================================"

          grep -q 'Photos/Photos.h' \
            plugins/photo_picker/photo_picker.mm \
            || {
              echo "ERROR: Photos header not found."
              exit 1
            }

          grep -q 'PHPhotoLibrary' \
            plugins/photo_picker/photo_picker.mm \
            || {
              echo "ERROR: PHPhotoLibrary not found."
              exit 1
            }

          grep -q 'creationRequestForAssetFromImageAtFileURL' \
            plugins/photo_picker/photo_picker.mm \
            || {
              echo "ERROR: Image save API not found."
              exit 1
            }

          grep -q 'creationRequestForAssetFromVideoAtFileURL' \
            plugins/photo_picker/photo_picker.mm \
            || {
              echo "ERROR: Video save API not found."
              exit 1
            }

          echo "OK: Photos save implementation detected."


          echo ""
          echo "======================================"
          echo "VERIFY PHOTO SAVE API"
          echo "======================================"

          for symbol in \
            'save_image' \
            'save_video' \
            'emit_image_saved' \
            'emit_video_saved' \
            'image_saved' \
            'video_saved'
          do
            if ! grep -q "$symbol" plugins/photo_picker/photo_picker.h \
               && ! grep -q "$symbol" plugins/photo_picker/photo_picker.mm
            then
              echo "ERROR: Photo save API symbol not found: $symbol"
              exit 1
            fi
          done

          echo "OK: Photo save API detected."


          echo ""
          echo "======================================"
          echo "PHOTO PICKER HEADER"
          echo "======================================"

          sed -n '1,240p' \
            plugins/photo_picker/photo_picker.h


          echo ""
          echo "======================================"
          echo "PHOTO PICKER IMPLEMENTATION"
          echo "======================================"

          sed -n '1,520p' \
            plugins/photo_picker/photo_picker.mm


      # ==========================================================
      # 9.1 VERIFICAR IOS DEPLOYMENT TARGET DO GODOT
      # ==========================================================

      - name: Inspect Godot iOS deployment target
        shell: bash
        run: |

          cd godot-ios-plugins/godot

          echo "======================================"
          echo "SEARCH ios_deployment_target"
          echo "======================================"

          grep -R \
            -n \
            "ios_deployment_target" \
            SConstruct \
            platform \
            methods.py \
            2>/dev/null \
            || true


      # ==========================================================
      # 9.2 AJUSTAR IOS DEPLOYMENT TARGET DO PHOTOPICKER
      # ==========================================================

      - name: Set PhotoPicker iOS deployment target
        shell: bash
        run: |

          cd godot-ios-plugins

          echo "======================================"
          echo "CURRENT IOS DEPLOYMENT TARGET"
          echo "======================================"

          grep -n \
            -E \
            'mios-simulator-version-min|miphoneos-version-min' \
            SConstruct \
            || true

          echo ""
          echo "======================================"
          echo "SETTING IOS DEPLOYMENT TARGET TO 15.0"
          echo "======================================"

          sed -i '' \
            's/-mios-simulator-version-min=12\.0/-mios-simulator-version-min=15.0/g' \
            SConstruct

          sed -i '' \
            's/-miphoneos-version-min=12\.0/-miphoneos-version-min=15.0/g' \
            SConstruct

          echo ""
          echo "======================================"
          echo "VERIFY IOS DEPLOYMENT TARGET"
          echo "======================================"

          grep -n \
            -E \
            'mios-simulator-version-min|miphoneos-version-min' \
            SConstruct

          echo ""
          echo "======================================"
          echo "VERIFY NO IOS 12 TARGET REMAINS"
          echo "======================================"

          if grep -q \
            -E \
            'mios-simulator-version-min=12\.0|miphoneos-version-min=12\.0' \
            SConstruct
          then
            echo "ERROR: iOS 12 deployment target still present."
            exit 1
          fi

          echo "OK: PhotoPicker deployment target is iOS 15.0."


      # ==========================================================
      # 10. COMPILAR HEADERS DO GODOT PARA IOS
      # ==========================================================

      - name: Build Godot iOS headers
        run: |
          cd godot-ios-plugins/godot

          scons \
            platform=ios \
            target=editor \
            ios_deployment_target=15.0


      # ==========================================================
      # 11. GERAR XCFRAMEWORK RELEASE
      # ==========================================================

      - name: Build PhotoPicker release xcframework
        run: |
          cd godot-ios-plugins

          chmod +x scripts/generate_xcframework.sh

          scons \
            target=release \
            arch=arm64 \
            plugin=photo_picker \
            version=4.0 \
            ios_deployment_target=15.0

          scons \
            target=release \
            arch=x86_64 \
            simulator=yes \
            plugin=photo_picker \
            version=4.0 \
            ios_deployment_target=15.0

          scons \
            target=release \
            arch=arm64 \
            simulator=yes \
            plugin=photo_picker \
            version=4.0 \
            ios_deployment_target=15.0

          lipo -create \
            "./bin/libphoto_picker.x86_64-simulator.release.a" \
            "./bin/libphoto_picker.arm64-simulator.release.a" \
            -output "./bin/libphoto_picker-simulator.release.a"

          xcodebuild -create-xcframework \
            -library "./bin/libphoto_picker.arm64-ios.release.a" \
            -library "./bin/libphoto_picker-simulator.release.a" \
            -output "./bin/photo_picker.release.xcframework"


      # ==========================================================
      # 11.1 INSPECIONAR SÍMBOLOS DO PHOTOPICKER
      # ==========================================================

      - name: Inspect PhotoPicker symbols
        shell: bash
        run: |

          cd godot-ios-plugins

          echo "======================================"
          echo "PHOTO PICKER RELEASE LIBRARY"
          echo "======================================"

          ls -lh \
            bin/libphoto_picker.arm64-ios.release.a

          echo ""
          echo "======================================"
          echo "SEARCH INIT / DEINIT WITH STRINGS"
          echo "======================================"

          strings \
            bin/libphoto_picker.arm64-ios.release.a \
            | grep -E \
            'godot_photopicker_(init|deinit)' \
            || true

          echo ""
          echo "======================================"
          echo "SEARCH PHOTOPICKER SYMBOLS"
          echo "======================================"

          strings \
            bin/libphoto_picker.arm64-ios.release.a \
            | grep -E \
            'PhotoPicker|photopicker' \
            | head -100 \
            || true

          echo ""
          echo "======================================"
          echo "NM INIT / DEINIT"
          echo "======================================"

          nm -gU \
            bin/libphoto_picker.arm64-ios.release.a \
            | grep -E \
            'godot_photopicker_(init|deinit)' \
            || true


      # ==========================================================
      # 12. GERAR XCFRAMEWORK DEBUG
      # ==========================================================

      - name: Build PhotoPicker debug xcframework
        run: |
          cd godot-ios-plugins

          scons \
            target=debug \
            arch=arm64 \
            plugin=photo_picker \
            version=4.0 \
            ios_deployment_target=15.0

          scons \
            target=debug \
            arch=x86_64 \
            simulator=yes \
            plugin=photo_picker \
            version=4.0 \
            ios_deployment_target=15.0

          scons \
            target=debug \
            arch=arm64 \
            simulator=yes \
            plugin=photo_picker \
            version=4.0 \
            ios_deployment_target=15.0

          lipo -create \
            "./bin/libphoto_picker.x86_64-simulator.debug.a" \
            "./bin/libphoto_picker.arm64-simulator.debug.a" \
            -output "./bin/libphoto_picker-simulator.debug.a"

          xcodebuild -create-xcframework \
            -library "./bin/libphoto_picker.arm64-ios.debug.a" \
            -library "./bin/libphoto_picker-simulator.debug.a" \
            -output "./bin/photo_picker.debug.xcframework"


      # ==========================================================
      # 13. VERIFICAR ARQUIVOS GERADOS
      # ==========================================================

      - name: Verify generated files
        run: |
          cd godot-ios-plugins

          echo "======================================"
          echo "XCFRAMEWORKS"
          echo "======================================"

          find bin \
            -maxdepth 1 \
            -name "photo_picker*.xcframework" \
            -print

          echo ""
          echo "======================================"
          echo "STATIC LIBRARIES"
          echo "======================================"

          find bin \
            -maxdepth 1 \
            -name "libphoto_picker*.a" \
            -print

          echo ""
          echo "======================================"
          echo "GDIP"
          echo "======================================"

          find plugins/photo_picker \
            -maxdepth 1 \
            -name "*.gdip" \
            -print

          echo ""
          echo "======================================"
          echo "BIN DIRECTORY"
          echo "======================================"

          ls -lah bin


      # ==========================================================
      # 14. VALIDAR XCFRAMEWORK E GDIP
      # ==========================================================

      - name: Validate XCFramework and GDIP
        shell: bash
        run: |

          cd godot-ios-plugins

          echo "======================================"
          echo "VALIDATE RELEASE XCFRAMEWORK"
          echo "======================================"

          RELEASE_XCFRAMEWORK="bin/photo_picker.release.xcframework"

          if [ ! -d "$RELEASE_XCFRAMEWORK" ]; then
            echo "ERROR: Release XCFramework not found:"
            echo "$RELEASE_XCFRAMEWORK"
            exit 1
          fi

          echo "OK: Release XCFramework exists."

          find "$RELEASE_XCFRAMEWORK" \
            -maxdepth 3 \
            -type f \
            | sort


          echo ""
          echo "======================================"
          echo "VALIDATE DEBUG XCFRAMEWORK"
          echo "======================================"

          DEBUG_XCFRAMEWORK="bin/photo_picker.debug.xcframework"

          if [ ! -d "$DEBUG_XCFRAMEWORK" ]; then
            echo "ERROR: Debug XCFramework not found:"
            echo "$DEBUG_XCFRAMEWORK"
            exit 1
          fi

          echo "OK: Debug XCFramework exists."

          find "$DEBUG_XCFRAMEWORK" \
            -maxdepth 3 \
            -type f \
            | sort


          echo ""
          echo "======================================"
          echo "VALIDATE GDIP"
          echo "======================================"

          GDIP="plugins/photo_picker/photo_picker.gdip"

          if [ ! -f "$GDIP" ]; then
            echo "ERROR: .gdip file not found:"
            echo "$GDIP"
            exit 1
          fi

          echo "OK: .gdip exists."

          cat "$GDIP"


          echo ""
          echo "======================================"
          echo "VERIFY GDIP FRAMEWORKS"
          echo "======================================"

          if ! grep -q 'Photos.framework' "$GDIP"; then
            echo "ERROR: .gdip does not declare Photos.framework."
            exit 1
          fi

          if ! grep -q 'PhotosUI.framework' "$GDIP"; then
            echo "ERROR: .gdip does not declare PhotosUI.framework."
            exit 1
          fi

          echo "OK: Photos.framework declared."
          echo "OK: PhotosUI.framework declared."


          echo ""
          echo "======================================"
          echo "VERIFY PHOTO LIBRARY PERMISSION"
          echo "======================================"

          if ! grep -q 'NSPhotoLibraryAddUsageDescription' "$GDIP"; then
            echo "ERROR: .gdip does not declare NSPhotoLibraryAddUsageDescription."
            exit 1
          fi

          echo "OK: NSPhotoLibraryAddUsageDescription declared."


          echo ""
          echo "======================================"
          echo "VERIFY GDIP INITIALIZATION"
          echo "======================================"

          if ! grep -q 'initialization="godot_photopicker_init"' "$GDIP"; then
            echo "ERROR: PhotoPicker initialization function not declared."
            exit 1
          fi

          if ! grep -q 'deinitialization="godot_photopicker_deinit"' "$GDIP"; then
            echo "ERROR: PhotoPicker deinitialization function not declared."
            exit 1
          fi

          echo "OK: PhotoPicker initialization declared."
          echo "OK: PhotoPicker deinitialization declared."


          echo ""
          echo "======================================"
          echo "VERIFY PHOTO PICKER SOURCE"
          echo "======================================"

          if ! grep -q 'PhotosUI/PhotosUI.h' \
            plugins/photo_picker/photo_picker.mm
          then
            echo "ERROR: PhotosUI header not found."
            exit 1
          fi

          if ! grep -q 'PHPickerViewController' \
            plugins/photo_picker/photo_picker.mm
          then
            echo "ERROR: PHPickerViewController not found."
            exit 1
          fi

          echo "OK: PHPicker source detected."


          echo ""
          echo "======================================"
          echo "VERIFY PHOTOS SAVE SOURCE"
          echo "======================================"

          if ! grep -q 'Photos/Photos.h' \
            plugins/photo_picker/photo_picker.mm
          then
            echo "ERROR: Photos header not found."
            exit 1
          fi

          if ! grep -q 'PHPhotoLibrary' \
            plugins/photo_picker/photo_picker.mm
          then
            echo "ERROR: PHPhotoLibrary not found."
            exit 1
          fi

          if ! grep -q 'creationRequestForAssetFromImageAtFileURL' \
            plugins/photo_picker/photo_picker.mm
          then
            echo "ERROR: Image save API not found."
            exit 1
          fi

          if ! grep -q 'creationRequestForAssetFromVideoAtFileURL' \
            plugins/photo_picker/photo_picker.mm
          then
            echo "ERROR: Video save API not found."
            exit 1
          fi

          echo "OK: Photos image save API detected."
          echo "OK: Photos video save API detected."


          echo ""
          echo "======================================"
          echo "VERIFY PHOTO SAVE API"
          echo "======================================"

          for symbol in \
            'save_image' \
            'save_video' \
            'emit_image_saved' \
            'emit_video_saved' \
            'image_saved' \
            'video_saved'
          do
            if ! grep -q "$symbol" plugins/photo_picker/photo_picker.h \
               && ! grep -q "$symbol" plugins/photo_picker/photo_picker.mm
            then
              echo "ERROR: Photo save API symbol not found: $symbol"
              exit 1
            fi
          done

          echo "OK: Photo save API detected."


          echo ""
          echo "======================================"
          echo "VALIDATION COMPLETE"
          echo "======================================"

          echo "OK: Release XCFramework"
          echo "OK: Debug XCFramework"
          echo "OK: Photos.framework"
          echo "OK: PhotosUI.framework"
          echo "OK: NSPhotoLibraryAddUsageDescription"
          echo "OK: PhotoPicker initialization"
          echo "OK: PhotoPicker deinitialization"
          echo "OK: PHPicker source"
          echo "OK: Image save source"
          echo "OK: Video save source"
          echo "OK: Photo save API"


      # ==========================================================
      # 15. CRIAR PACOTE PARA O FLUXUS
      # ==========================================================

      - name: Package PhotoPicker
        shell: bash
        run: |

          cd godot-ios-plugins

          rm -rf ../PhotoPicker-Godot-4.6.3

          mkdir -p ../PhotoPicker-Godot-4.6.3

          cp -R \
            bin/photo_picker.release.xcframework \
            ../PhotoPicker-Godot-4.6.3/

          cp -R \
            bin/photo_picker.debug.xcframework \
            ../PhotoPicker-Godot-4.6.3/

          GDIP=$(find plugins/photo_picker \
            -maxdepth 1 \
            -name "*.gdip" \
            -print \
            -quit)

          cp "$GDIP" \
            ../PhotoPicker-Godot-4.6.3/

          cat > ../PhotoPicker-Godot-4.6.3/BUILD_INFO.txt << EOF
          ==========================================
          Fluxus PhotoPicker Plugin
          ==========================================

          Plugin:
          PhotoPicker

          Implementation:
          PHPickerViewController

          Frameworks:
          Photos.framework
          PhotosUI.framework

          Godot:
          4.6.3-stable

          PhotoPicker fix:
          PR #105

          PhotoPicker commit:
          2d94399

          Repository:
          https://github.com/godot-sdk-integrations/godot-ios-plugins

          Custom Fluxus source:
          plugins/photo_picker

          Selection limits:
          Free: 3 images
          Premium: 12 images

          Media:
          Images selected from Photos
          Images saved to Photos
          Videos saved to Photos

          Camera:
          Not used

          Photo Library Access:
          Add-only

          Permission:
          NSPhotoLibraryAddUsageDescription

          Build:
          GitHub Actions

          Runner:
          macos-15-intel

          Architectures:
          arm64 device
          arm64 simulator
          x86_64 simulator

          Generated:
          $(date -u)

          ==========================================
          EOF


      # ==========================================================
      # 16. MOSTRAR PACOTE
      # ==========================================================

      - name: Show package
        run: |

          echo "======================================"
          echo "FINAL PACKAGE"
          echo "======================================"

          find PhotoPicker-Godot-4.6.3 \
            -maxdepth 2 \
            -print

          echo ""
          echo "======================================"
          echo "PACKAGE SIZE"
          echo "======================================"

          du -sh PhotoPicker-Godot-4.6.3


      # ==========================================================
      # 17. CRIAR ZIP
      # ==========================================================

      - name: Create ZIP
        run: |

          zip -r \
            PhotoPicker-Godot-4.6.3.zip \
            PhotoPicker-Godot-4.6.3


      # ==========================================================
      # 18. PUBLICAR ARTIFACT NO GITHUB ACTIONS
      # ==========================================================

      - name: Upload PhotoPicker artifact
        uses: actions/upload-artifact@v4

        with:
          name: PhotoPicker-Godot-4.6.3

          path: PhotoPicker-Godot-4.6.3.zip

          if-no-files-found: error

          retention-days: 30
